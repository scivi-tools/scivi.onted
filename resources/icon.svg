<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- SciVi.OntEd application icon: a small ontology graph (three terms, three relations)
       on a macOS-style rounded square. Relation colours: is_a, has, is_used (see config). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7E8EC"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <marker id="hBlue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F01F5"/>
    </marker>
    <marker id="hRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B82619"/>
    </marker>
    <marker id="hGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#55BB36"/>
    </marker>
  </defs>

  <!-- Background: the macOS icon grid's 824x824 rounded square. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Relations (drawn under the terms). Each line stops half-way into its arrowhead. -->
  <g stroke-width="26" stroke-linecap="round" fill="none">
    <line x1="292" y1="628" x2="455" y2="372" stroke="#0F01F5" marker-end="url(#hBlue)"/>
    <line x1="732" y1="628" x2="569" y2="372" stroke="#B82619" marker-end="url(#hRed)"/>
    <line x1="418" y1="700" x2="572" y2="700" stroke="#55BB36" marker-end="url(#hGreen)"/>
  </g>

  <!-- Terms: two ordinary (white), one system term (light yellow). Grey bars stand for names. -->
  <g stroke="#55554F" stroke-width="10" filter="url(#boxShadow)">
    <rect x="377" y="216" width="270" height="124" rx="22" fill="#FFFFFF"/>
    <rect x="145" y="640" width="270" height="124" rx="22" fill="#FFFFFF"/>
    <rect x="609" y="640" width="270" height="124" rx="22" fill="#FFF3B0"/>
  </g>
  <g fill="#8E8E88">
    <rect x="427" y="263" width="170" height="30" rx="15"/>
    <rect x="195" y="687" width="170" height="30" rx="15"/>
    <rect x="659" y="687" width="170" height="30" rx="15"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
